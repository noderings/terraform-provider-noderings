# Runs the test suite against the real NodeRings API. Manual only: it creates
# and deletes real resources. Needs the NODERINGS_TOKEN and
# NODERINGS_ACC_DOMAIN repository secrets.
name: Acceptance tests (live API)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - env:
          TF_ACC: "1"
          NODERINGS_ACC: "1"
          NODERINGS_TOKEN: ${{ secrets.NODERINGS_TOKEN }}
          NODERINGS_ACC_DOMAIN: ${{ secrets.NODERINGS_ACC_DOMAIN }}
        run: go test -v -cover -timeout 50m -parallel 2 ./...
