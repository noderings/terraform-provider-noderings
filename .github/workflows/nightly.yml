# Nightly live tests against the NodeRings API. Runs only when the
# NODERINGS_TOKEN secret is set; otherwise the job skips with a notice and
# succeeds. Cheap/free operations only: billed compute packages are not
# enabled (their plan variables are left unset). DNS tests run when the
# optional NODERINGS_ACC_DOMAIN secret is set. The tests create and delete
# their own resources.
name: Nightly live API

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODERINGS_TOKEN: ${{ secrets.NODERINGS_TOKEN }}
    steps:
      - name: Skip when NODERINGS_TOKEN is not set
        if: env.NODERINGS_TOKEN == ''
        run: echo "::notice title=Live tests skipped::Add the repository secret NODERINGS_TOKEN (a service account token for a test organization) to run them."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NODERINGS_TOKEN != ''
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.NODERINGS_TOKEN != ''
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.NODERINGS_TOKEN != ''
        with:
          terraform_wrapper: false
      - name: Acceptance tests (cheap packages)
        if: env.NODERINGS_TOKEN != ''
        env:
          TF_ACC: "1"
          NODERINGS_ACC: "1"
          NODERINGS_TOKEN: ${{ secrets.NODERINGS_TOKEN }}
          NODERINGS_ACC_DOMAIN: ${{ secrets.NODERINGS_ACC_DOMAIN }}
        run: go test -v -cover -timeout 50m -parallel 2 ./...
